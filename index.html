<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --amarillo:#D9B40F; --naranja:#C8640C; --oliva:#7F8219; --azul:#5A7FA6; --pizarra:#3f5566;
    --gris:#555; --texto:#3d3d3d; --suave:#8a8a8a; --linea:#ECE7DF; --fondo:#FAF8F4; --tarjeta:#fff;
    --fijo:#eef2f5; --rojo:#c62828; --rosa:#fdecea;
    /* color del saludo «Bienvenido a casa» */
    --hero:linear-gradient(135deg,#4F7398 0%,#5A7FA6 50%,#7F9DBF 100%);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--fondo);color:var(--texto);font-family:'Nunito Sans',Arial,sans-serif;font-size:15px}
  button,input,select,textarea{font-family:inherit;font-size:15px}
  a{color:inherit}
  .franja{display:flex;height:5px}.franja i{flex:1}
  .franja i:nth-child(1){background:var(--amarillo)}.franja i:nth-child(2){background:var(--naranja)}
  .franja i:nth-child(3){background:var(--oliva)}.franja i:nth-child(4){background:var(--azul)}
  header{padding-top:env(safe-area-inset-top);position:sticky;top:0;z-index:5;background:var(--fondo)}
  .barra{display:flex;align-items:center;justify-content:space-between;padding:12px 16px 8px;max-width:640px;margin:0 auto}
  .marca-con-logo{display:flex;align-items:center;gap:10px}
  .logo{width:40px;height:40px;object-fit:contain}
  .marca{line-height:1.05}.marca small{display:block;font-size:11px;color:var(--suave);font-weight:700;letter-spacing:.04em;text-transform:uppercase}
  .marca b{display:block;font-size:18px;font-weight:900;color:var(--gris)}
  .marca .m2{display:block;font-size:12px;font-weight:700;color:#777;margin-top:1px}
  .marca small{margin-top:2px;color:var(--naranja)!important;font-size:10px!important}
  .usuario{font-size:12px;color:var(--suave);text-align:right;max-width:50%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .usuario a{color:var(--azul);font-weight:800;text-decoration:none;display:block;margin-top:2px}
  main{padding:4px 16px 100px;max-width:640px;margin:0 auto}
  h2{font-size:22px;font-weight:900;color:var(--gris);margin:12px 0 2px}
  h3{font-size:13px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;color:var(--suave);margin:22px 2px 10px}
  .sub{color:var(--suave);font-size:13px;margin:0 0 14px}
  .vacio{color:var(--suave);text-align:center;padding:28px 10px}

  /* ---------- portada */
  .hero{border-radius:20px;padding:22px 20px 20px;margin:6px 0 4px;color:#fff;position:relative;overflow:hidden;
        background:var(--hero)}
  .hero:after{content:"";position:absolute;right:-40px;top:-40px;width:170px;height:170px;border-radius:50%;background:rgba(255,255,255,.12)}
  .hero:before{content:"";position:absolute;right:40px;bottom:-60px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.08)}
  .hero small{font-weight:800;font-size:12px;letter-spacing:.06em;text-transform:uppercase;opacity:.9}
  .hero h1{font-size:27px;line-height:1.08;font-weight:900;margin:6px 0 6px;position:relative;z-index:1}
  .hero p{margin:0;font-size:14px;opacity:.95;position:relative;z-index:1}
  .destacado{background:var(--tarjeta);border-radius:18px;padding:16px;margin-top:14px;display:flex;gap:14px;
             border:1px solid var(--linea);box-shadow:0 6px 18px rgba(85,85,85,.08)}
  .fechaG{flex:0 0 66px;border-radius:14px;text-align:center;padding:8px 0;color:#fff;background:var(--c,var(--azul));align-self:flex-start}
  .fechaG b{display:block;font-size:28px;line-height:1;font-weight:900}
  .fechaG span{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.05em}
  .destacado .eti{font-size:11px;font-weight:900;letter-spacing:.06em;color:var(--naranja);text-transform:uppercase}
  .destacado .tit{font-size:18px;font-weight:900;color:#333;margin:2px 0 4px;line-height:1.2}
  .destacado .det{font-size:13px;color:var(--suave)}
  .agregar{display:inline-flex;align-items:center;gap:6px;margin-top:10px;font-size:13px;font-weight:800;color:var(--azul);text-decoration:none;
           background:#eef3f8;border-radius:20px;padding:6px 12px}
  .agregar svg{width:15px;height:15px}
  .serv-cab{font-size:12px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;color:var(--naranja);margin:26px 2px 10px;display:flex;align-items:center;gap:8px}
  .serv-cab:before{content:"🙋";font-size:15px}
  .serv-nota{background:#F1EAF8;color:#4b2a78;border-radius:12px;padding:10px 12px;font-weight:800;font-size:13px;margin-bottom:10px}
  .serv-grid{display:grid;grid-template-columns:1fr;gap:10px}
  .serv-card{background:#fff;border:1px solid var(--linea);border-radius:14px;padding:10px 14px 8px;border-top:4px solid var(--c)}
  .serv-area{font-size:12px;font-weight:900;color:var(--c);text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px}
  .serv-grupo{font-size:12px;font-weight:800;color:var(--gris);margin:8px 0 2px}
  .serv-fila{display:flex;gap:10px;padding:5px 0;border-bottom:1px dashed #efe9df;font-size:13.5px}
  .serv-fila:last-child{border-bottom:0}
  .serv-rol{flex:0 0 38%;color:var(--suave);font-weight:700;font-size:12.5px}
  .serv-nom{flex:1;color:#333;font-weight:700}
  .serv-nom em{display:block;font-style:normal;font-weight:600;color:var(--suave);font-size:12px}
  .herr-acceso{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:linear-gradient(135deg,#fff8ee,#fff);border:1px solid #f1d7b8;border-radius:14px;padding:12px 14px;margin:0 0 16px;color:var(--gris)}
  .herr-acceso span{font-size:24px}.herr-acceso div{flex:1}.herr-acceso b{display:block;font-size:15px}.herr-acceso small{color:var(--suave);font-size:12px}.herr-acceso i{font-style:normal;font-size:24px;color:var(--naranja)}
  .herr-caja{background:#fff;border:1px solid var(--linea);border-radius:16px;padding:6px 16px 16px;margin-bottom:14px}
  .herr-caja h3{margin:14px 0 10px;color:var(--gris)}
  .herr-botones{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .herr-botones button{text-align:left;border:1px solid var(--linea);background:#faf7f1;border-radius:12px;padding:12px;color:var(--gris)}
  .herr-botones b{display:block;font-size:14px}.herr-botones small{font-size:12px;color:var(--suave)}
  .meses12{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
  .meses12 button{border:1px solid var(--linea);background:#fff;border-radius:10px;padding:9px 0;font-weight:800;color:var(--gris);font-size:13px}
  .meses12 button.on{background:var(--gris);color:#fff;border-color:var(--gris)}
  .herr-esp{display:flex;align-items:center;gap:14px;padding:16px}.herr-esp b{display:block}.herr-esp small{color:var(--suave)}
  .piezas{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .pieza img{width:100%;border-radius:10px;display:block;border:1px solid var(--linea)}
  .pieza .acciones{gap:6px}.pieza .acciones button{padding:7px 2px;font-size:12px;min-width:0}
  .minombre{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#fff;border:1px solid var(--linea);border-radius:12px;padding:10px 14px;margin:0 0 14px;font-size:13px;color:var(--suave)}
  .minombre b{color:var(--gris)}
  .minombre button{border:0;background:#eef3f8;color:var(--azul);font-weight:800;border-radius:20px;padding:6px 12px;font-size:13px}
  .anuncio{display:flex;gap:12px;align-items:flex-start;background:#FFF9E3;border:1px solid #F1DF97;border-radius:14px;padding:12px 14px;margin-top:12px}
  .anuncio .ic{flex:0 0 30px;height:30px;border-radius:50%;background:var(--amarillo);color:#fff;display:flex;align-items:center;justify-content:center}
  .anuncio .ic svg{width:16px;height:16px}
  .anuncio b{display:block;font-size:14px;font-weight:900;color:#5b4a00}
  .anuncio p{margin:2px 0 0;font-size:13px;color:#6b5d26;white-space:pre-line}
  .anuncio a{display:inline-block;margin-top:6px;font-size:13px;font-weight:800;color:var(--naranja);text-decoration:none}

  /* ---------- lista con fecha al lado */
  .fila-ev{display:flex;gap:12px;margin-bottom:10px}
  .fecha{flex:0 0 48px;text-align:center;padding-top:4px}
  .fecha b{display:block;font-size:22px;font-weight:900;color:var(--gris);line-height:1}
  .fecha span{font-size:11px;font-weight:800;color:var(--suave);text-transform:uppercase}
  .fecha.hoy b,.fecha.hoy span{color:var(--naranja)}
  .col{flex:1;min-width:0}
  .sep-mes{font-size:12px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;color:var(--naranja);margin:16px 0 8px 60px}
  .tarjeta{background:var(--tarjeta);border-radius:14px;padding:12px 14px 12px 16px;margin-bottom:8px;position:relative;
           box-shadow:0 1px 2px rgba(0,0,0,.04);border:1px solid var(--linea)}
  .tarjeta:before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:4px;border-radius:0 4px 4px 0;background:var(--c,var(--azul))}
  .tarjeta.fijo{background:var(--fijo);border-color:#e1e7ec}
  .t-tit{font-weight:800;font-size:15px;color:#333}
  .t-det{font-size:13px;color:var(--suave);margin-top:3px}
  .t-det b{color:var(--gris)}
  .t-not{font-size:13px;color:var(--gris);margin-top:6px;background:#faf7f1;border-radius:8px;padding:6px 8px}
  .chip{display:inline-block;font-size:11px;font-weight:800;padding:2px 8px;border-radius:20px;margin-left:6px;vertical-align:1px}
  .chip.rep{background:#eaf0f8;color:#3e5f84}.chip.apl{background:#fdf2e7;color:#a04d00}.chip.reunion{background:#efefef;color:#666}
  .festivo{background:var(--rosa);color:var(--rojo);font-weight:800;font-size:13px;border-radius:10px;padding:8px 12px;margin-bottom:8px}
  .leyenda{display:flex;flex-wrap:wrap;gap:6px 12px;margin:14px 2px 0;font-size:12px;color:var(--suave);font-weight:700}
  .leyenda span:before{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--c);margin-right:5px;vertical-align:0}

  /* ---------- calendario */
  .mes{display:flex;align-items:center;justify-content:space-between;margin:8px 0 10px}
  .mes h2{margin:0}
  .flecha{background:var(--tarjeta);border:1px solid var(--linea);border-radius:12px;width:42px;height:42px;font-size:22px;color:var(--gris)}
  .grilla{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
  .cab{font-size:11px;font-weight:800;color:var(--suave);text-align:center;padding:4px 0}
  .celda{background:var(--tarjeta);border:1px solid var(--linea);border-radius:10px;min-height:52px;padding:5px 3px;text-align:center;cursor:pointer}
  .celda.fuera{background:transparent;border-color:transparent;cursor:default}
  .celda.finde{background:#f8f6f1}
  .celda.fest{background:var(--rosa)}
  .celda.hoy{outline:2px solid var(--naranja);outline-offset:-2px}
  .celda.sel{background:var(--gris);border-color:var(--gris)}.celda.sel .num{color:#fff}
  .num{font-weight:800;font-size:14px;color:var(--gris)}
  .celda.fest .num{color:var(--rojo)}
  .puntos{display:flex;flex-wrap:wrap;justify-content:center;gap:3px;margin-top:4px}
  .puntos i{width:6px;height:6px;border-radius:50%;background:var(--c)}

  /* ---------- panel */
  .min{background:var(--tarjeta);border:1px solid var(--linea);border-radius:18px;margin-bottom:16px;overflow:hidden}
  .min-cab{padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;border-bottom:1px solid var(--linea)}
  .min-cab b{font-size:17px;font-weight:900;color:var(--gris)}
  .rol{font-size:11px;font-weight:900;letter-spacing:.04em;text-transform:uppercase;border-radius:20px;padding:4px 10px;white-space:nowrap}
  .rol.coordinador{background:#fdf2e7;color:var(--naranja)}.rol.equipo{background:#eef3f8;color:var(--azul)}
  .min-cuerpo{padding:4px 16px 14px}
  .min-cuerpo h3{margin:14px 0 8px}
  .personas{display:flex;flex-wrap:wrap;gap:6px}
  .persona{font-size:12px;font-weight:700;background:#f4f1ea;border-radius:20px;padding:4px 10px;color:var(--gris);max-width:100%;overflow:hidden;text-overflow:ellipsis}
  .persona.c{background:#fdf2e7;color:#a04d00}
  .reu{border-left:3px solid #bdbdbd;padding:6px 0 6px 12px;margin-bottom:8px}
  .reu .t-tit{font-size:14px}
  .boton-mini{border:0;background:var(--naranja);color:#fff;font-weight:800;border-radius:10px;padding:10px 14px;width:100%;margin-top:12px}
  .boton-foto{border:1px solid var(--linea);background:#fff;color:var(--gris);font-weight:800;border-radius:10px;padding:10px 14px;width:100%;margin-top:8px}
  .subir{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;border:2px dashed #d9cfbf;border-radius:16px;
         padding:26px 12px;background:#fff;color:var(--gris);font-weight:800;text-align:center;cursor:pointer;margin-top:14px}
  .subir svg{width:34px;height:34px;color:var(--naranja)}
  .subir small{font-weight:600;color:var(--suave)}
  .miniaturas{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:12px}
  .miniaturas div{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:#eee}
  .miniaturas img{width:100%;height:100%;object-fit:cover;display:block}
  .miniaturas button{position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:50%;border:0;background:rgba(0,0,0,.55);color:#fff;font-size:14px;line-height:1}
  .miniaturas .ok:after{content:"✓";position:absolute;inset:0;background:rgba(127,130,25,.55);color:#fff;font-size:30px;font-weight:900;display:flex;align-items:center;justify-content:center}
  .nov{display:flex;gap:12px;margin-bottom:14px}
  .nov .ico{flex:0 0 34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:15px;background:var(--c)}
  .nov .txt{font-size:14px;color:var(--texto)}
  .nov .txt b{color:#333}
  .nov .cuando{font-size:12px;color:var(--suave);margin-top:2px}

  /* ---------- formularios */
  label{display:block;font-size:12px;font-weight:800;color:var(--gris);margin:14px 0 6px;letter-spacing:.02em}
  input,select,textarea{font-size:16px!important;width:100%;padding:12px;border:1px solid #ddd6cb;border-radius:10px;background:#fff;color:#333}
  textarea{min-height:70px;resize:vertical}
  .fila{display:flex;gap:10px}.fila>div{flex:1}
  .boton{display:block;width:100%;border:0;border-radius:12px;padding:14px;font-weight:800;color:#fff;background:var(--naranja);margin-top:18px}
  .boton.sec{background:var(--tarjeta);color:var(--gris);border:1px solid var(--linea)}
  .boton:disabled{opacity:.6}
  .acciones{display:flex;gap:8px;margin-top:8px}
  .acciones button{flex:1;border-radius:10px;padding:8px;font-weight:800;border:1px solid var(--linea);background:#fff;color:var(--gris);font-size:13px}
  .acciones .peligro{color:var(--rojo);border-color:#f2c9c4}
  .otro{display:block;text-align:center;margin-top:16px;color:var(--azul);font-weight:700;text-decoration:none}
  .codigo{letter-spacing:10px;text-align:center;font-size:24px;font-weight:800}
  .caja-login{background:var(--tarjeta);border:1px solid var(--linea);border-radius:18px;padding:6px 16px 20px;margin-top:10px}

  /* ---------- navegación y avisos */
  nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--linea);display:flex;justify-content:center;
      padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:6}
  nav button{flex:1;max-width:160px;background:none;border:0;color:#7a7a7a;font-size:11px;font-weight:800;padding:6px 0;position:relative}
  nav button svg{display:block;margin:0 auto 3px;width:22px;height:22px}
  nav button.on{color:var(--naranja)}
  nav .punto{position:absolute;top:4px;left:calc(50% + 8px);width:8px;height:8px;border-radius:50%;background:var(--rojo)}
  .cargando{position:fixed;inset:0;background:rgba(250,248,244,.75);display:none;align-items:center;justify-content:center;z-index:20}
  .cargando.on{display:flex}
  .rueda{width:38px;height:38px;border:4px solid var(--linea);border-top-color:var(--naranja);border-radius:50%;animation:g .8s linear infinite}
  @keyframes g{to{transform:rotate(360deg)}}
  .toast{position:fixed;left:16px;right:16px;bottom:90px;background:var(--gris);color:#fff;border-radius:12px;padding:12px 14px;
         font-weight:700;font-size:14px;opacity:0;transform:translateY(10px);transition:.25s;z-index:30;pointer-events:none;max-width:600px;margin:0 auto}
  .toast.on{opacity:1;transform:none}.toast.error{background:var(--rojo)}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:flex-end;justify-content:center;z-index:25}
  .modal.on{display:flex}
  .modal .caja{background:#fff;border-radius:18px 18px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom));width:100%;max-width:640px}

  /* ---------- plan operativo */
  .buscar{margin:4px 0 10px}
  .filtros{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin:0 -16px 6px;padding-left:16px;padding-right:16px;scrollbar-width:none}
  .filtros::-webkit-scrollbar{display:none}
  .filtros button{flex:0 0 auto;border:1px solid var(--linea);background:#fff;color:var(--gris);font-weight:800;font-size:13px;border-radius:20px;padding:7px 12px;display:flex;align-items:center;gap:6px}
  .filtros button i{width:8px;height:8px;border-radius:50%;background:var(--c)}
  .filtros button.on{background:var(--gris);border-color:var(--gris);color:#fff}
  .pmes{background:var(--tarjeta);border:1px solid var(--linea);border-radius:16px;margin:12px 0;overflow:hidden;scroll-margin-top:80px}
  .pmes-cab{display:flex;align-items:baseline;justify-content:space-between;padding:12px 16px;background:#f6f3ee;border-bottom:1px solid var(--linea)}
  .pmes-cab b{font-size:17px;font-weight:900;color:var(--gris)}
  .pmes-cab span{font-size:12px;color:var(--suave);font-weight:700}
  .pfila{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid #f2eee7}
  .pfila:last-child{border-bottom:0}
  .pfila.viejo{opacity:.5}
  .pfila.hoy{background:#fff8ee}
  .pdia{flex:0 0 36px;text-align:center}
  .pdia b{display:block;font-size:17px;font-weight:900;color:var(--gris);line-height:1}
  .pdia span{font-size:10px;font-weight:800;color:var(--suave);text-transform:uppercase}
  .pbar{flex:0 0 4px;align-self:stretch;border-radius:4px;background:var(--c)}
  .pfila .t-tit{font-size:14px}
  .lbl-larga{display:none}

  /* ---------- computador / tablet ---------- */
  .mini{display:none}
  @media (min-width:900px){
    body{font-size:15px}
    .barra{max-width:1160px;padding:14px 24px 12px}
    main{max-width:1160px;padding:8px 24px 48px}
    nav{position:fixed;top:5px;bottom:auto;left:calc(max(0px,(100vw - 1160px) / 2) + 300px);right:calc(max(0px,(100vw - 1160px) / 2) + 130px);
        width:auto;background:transparent;border:0;padding:12px 0;z-index:7;pointer-events:none;justify-content:center}
    nav button{pointer-events:auto}
    nav button{flex:0 0 auto;max-width:none;display:flex;align-items:center;gap:7px;font-size:14.5px;padding:8px 14px;border-radius:10px;color:#666;
               -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
    nav button:hover{background:#f1ede6;color:var(--gris)}
    nav button svg{margin:0;width:19px;height:19px}
    nav button.on{background:#fdf2e7}
    nav .punto{top:6px;left:auto;right:6px}
    .toast{bottom:24px;left:auto;right:24px;max-width:380px}
    .modal{align-items:center}.modal .caja{border-radius:18px;max-width:460px}
    h2{font-size:26px}
    /* inicio en dos columnas */
    .ini{display:grid;grid-template-columns:400px 1fr;grid-template-rows:auto 1fr;grid-template-areas:"a l" "b l";gap:0 32px;align-items:start}
    .ini-a{grid-area:a}.ini-b{grid-area:b}.ini-l{grid-area:l}
    .ini-l h3{margin-top:14px}
    .hero{padding:30px 26px}.hero h1{font-size:34px}
    /* calendario grande con nombres */
    #calCuerpo{display:grid;grid-template-columns:1fr 330px;gap:28px;align-items:start}
    .celda{min-height:104px;text-align:left;padding:6px 7px}
    .num{font-size:13px}
    .puntos{display:none}
    .mini{display:block;margin-top:4px}
    .mini span{display:block;font-size:11px;font-weight:700;color:#444;background:#f6f3ee;border-left:3px solid var(--c);border-radius:4px;
               padding:2px 5px;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .mini em{font-size:11px;color:var(--suave);font-style:normal;font-weight:700}
    .celda.sel{background:#fff;border-color:var(--gris);box-shadow:inset 0 0 0 2px var(--gris)}.celda.sel .num{color:var(--gris)}
    .celda.fest{background:var(--rosa)}
    #calLista{position:sticky;top:80px}
    #calLista h3{margin-top:0}
    /* panel */
    .mins{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start}
    .mins .min{margin:0}
    .lbl-corta{display:none}.lbl-larga{display:inline}
    #tHerr{max-width:760px;margin:0 auto}
    #calLista .serv-grid{grid-template-columns:1fr}.piezas{grid-template-columns:repeat(3,1fr)}
    #tPlan .filtros{margin:0 0 6px;padding:0 0 6px;flex-wrap:wrap}
    .planMeses{display:grid;grid-template-columns:1fr 1fr;gap:0 18px;align-items:start}
    #tProgramar,#tFotos,#tLideres,#tNovedades{max-width:620px;margin:0 auto}
    .miniaturas{grid-template-columns:repeat(4,1fr)}
  }
  @media (min-width:900px) and (max-width:1100px){ .usuario span{display:none} }
  @media (min-width:900px) and (max-width:1250px){
    nav{right:calc(max(0px,(100vw - 1160px) / 2) + 70px)!important} nav button{padding:8px 9px!important;font-size:13.5px!important}
    .lbl-larga{display:none!important}.lbl-corta{display:inline!important} }
  .oculto{display:none!important}
</style>

<script>
(function(){
  const MESES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  const MES3=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  const DIAS=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
  const DIA3=['dom','lun','mar','mié','jue','vie','sáb'];
  const $=id=>document.getElementById(id);
  const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const norm=s=>String(s||'').toUpperCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
  const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
  let token='publico', usuario=null, info={publico:true}, correoPendiente='', vistaMes=null;
  const PESTANAS=['tHerr','tInicio','tCalendario','tPlan','tPanel','tNovedades','tProgramar','tFotos','tLideres'];

  const guardar=(k,v)=>{try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}};
  const leer=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
  const leerJ=k=>{try{return JSON.parse(localStorage.getItem(k)||'null')}catch(e){return null}};
  const guardarJ=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
  const quien=()=>esLider()?usuario.email:'pub';

  function llamar(fn,...args){
    if(window.google&&google.script&&google.script.run)
      return new Promise((ok,mal)=>{ google.script.run.withSuccessHandler(ok).withFailureHandler(mal)[fn](...args) });
    // versión instalable (GitHub Pages): habla con la misma app por internet
    return fetch(window.API_URL,{method:'POST',redirect:'follow',headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify({fn:fn,args:args})}).then(r=>{ if(!r.ok) throw new Error('Sin conexión ('+r.status+')'); return r.json() });
  }
  function cargando(on){$('cargando').classList.toggle('on',!!on)}
  let tt; function aviso(txt,error){const t=$('toast');t.textContent=txt;t.className='toast on'+(error?' error':'');clearTimeout(tt);tt=setTimeout(()=>t.className='toast',3500)}
  function revisar(r){ if(r&&r.ok===false&&r.sesion){sesionVencida();return false} if(r&&r.ok===false){aviso(r.msg||'Algo falló',true);return false} return true }
  const esLider=()=>!!(usuario&&!usuario.publico);

  // ---------- fechas y colores
  const clave=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  const deClave=k=>{const[a,m,d]=k.split('-').map(Number);return new Date(a,m-1,d)};
  const fechaLarga=k=>{const d=deClave(k);return DIAS[d.getDay()]+' '+d.getDate()+' de '+MESES[d.getMonth()]};
  const hora12=h=>{if(!h)return'';let[a,m]=h.split(':').map(Number);const p=a>=12?'p. m.':'a. m.';a=a%12||12;return a+':'+String(m).padStart(2,'0')+' '+p};
  const faltan=k=>{const n=Math.round((deClave(k)-deClave(clave(new Date())))/864e5);return n<=0?'Hoy':n===1?'Mañana':'En '+n+' días'};
  const CATS=[['Cultos y fijos','var(--pizarra)'],['Vida espiritual','var(--amarillo)'],['Evangelismo','var(--oliva)'],['Comunión','var(--naranja)'],['Otros','var(--azul)']];
  function color(ev){
    if(ev.tipo==='reunion')return'#9a9a9a';
    const t=norm(ev.titulo);
    if(ev.fijo)return CATS[0][1];
    if(/EVANGEL|IMPACTO/.test(t))return CATS[2][1];
    if(/ALMUERZO|COOPERATIV/.test(t))return CATS[3][1];
    if(/SANTIFICACION|BAUTISMO|RETIRO|AYUNO|ORACION|VIGILIA/.test(t))return CATS[1][1];
    return CATS[4][1];
  }
  function enlaceCalendario(ev){
    const f=ev.fecha.replace(/-/g,'');
    let dates;
    if(ev.tipo==='reunion'&&ev.horaIni){ const hi=ev.horaIni.replace(':','')+'00', hf=(ev.horaFin||ev.horaIni).replace(':','')+'00'; dates=f+'T'+hi+'/'+f+'T'+hf }
    else { const fin=deClave(ev.hasta||ev.fecha); fin.setDate(fin.getDate()+1); dates=f+'/'+clave(fin).replace(/-/g,'') }
    const p=new URLSearchParams({action:'TEMPLATE',text:ev.titulo,dates:dates,ctz:'America/Bogota',
      details:(ev.responsable?'A cargo de '+ev.responsable+'. ':'')+'Iglesia Alianza Buenavista',location:ev.lugar||''});
    return 'https://calendar.google.com/calendar/render?'+p.toString();
  }
  const ICO_CAL='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M12 11v6M9 14h6"/></svg>';
  function chipEstado(e){const n=norm(e);return n==='REPROGRAMADO'?'<span class="chip rep">Reprogramado</span>':n==='APLAZADO'?'<span class="chip apl">Aplazado</span>':''}
  function detalle(ev){
    if(ev.tipo==='reunion') return `<b>${esc(hora12(ev.horaIni))}${ev.horaFin?' – '+esc(hora12(ev.horaFin)):''}</b> · ${esc(ev.ministerio)}${ev.lugar?' · '+esc(ev.lugar):''}`;
    return (ev.hasta?'Hasta el '+esc(fechaLarga(ev.hasta))+' · ':'')+(ev.responsable?'A cargo de <b>'+esc(ev.responsable)+'</b>':'Para toda la iglesia');
  }
  function tarjeta(ev){
    return `<div class="tarjeta${ev.fijo?' fijo':''}" style="--c:${color(ev)}">
      <div class="t-tit">${esc(ev.titulo)}${ev.tipo==='reunion'?'<span class="chip reunion">Reunión</span>':''}${chipEstado(ev.estado)}</div>
      <div class="t-det">${detalle(ev)}</div></div>`;
  }
  const leyenda=()=>'<div class="leyenda">'+CATS.map(c=>`<span style="--c:${c[1]}">${c[0]}</span>`).join('')+(esLider()?'<span style="--c:#9a9a9a">Reuniones</span>':'')+'</div>';
  const limpiarNotas=n=>String(n||'').replace(/\s*·?\s*(Programada|Editada) en la app por .*$/,'');

  // ---------- navegación
  document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>pestana(b.dataset.t));
  function pestana(id){
    PESTANAS.forEach(t=>$(t).classList.toggle('oculto',t!==id));

  // ---------- inicio (lo que ve cualquier persona)
  async function verInicio(datos){
    const box=$('tInicio'), k='c_prox_'+quien();
    const hero=`<div class="hero"><h1>${esLider()&&usuario.nombre?'Hola, '+esc(usuario.nombre):'Bienvenido a casa'}</h1>
      <p>Aquí está todo lo que viene en nuestra iglesia.</p></div>`;
    const previo=datos||leerJ(k);
    if(previo&&previo.ok) pintar(previo); else box.innerHTML=hero+'<div class="vacio">Cargando…</div>';
    if(datos){ guardarJ(k,datos); return }
    try{ const r=await llamar('appProximos',token); if(!revisar(r))return;
      guardarJ(k,r); if(!$('tInicio').classList.contains('oculto')) pintar(r);
    }catch(e){ if(!previo) box.innerHTML=hero+'<div class="vacio">No se pudo cargar: '+esc(e.message)+'</div>'}
    function pintar(r){
      const evs=r.eventos;
      let html='<div class="ini"><div class="ini-a">'+hero;
      const sig=evs.find(e=>e.tipo==='plan')||evs[0];
      if(sig){ const d=deClave(sig.fecha);
        html+=`<div class="destacado"><div class="fechaG" style="--c:${color(sig)}"><span>${DIA3[d.getDay()]}</span><b>${d.getDate()}</b><span>${MES3[d.getMonth()]}</span></div>
          <div class="col"><div class="eti">${esc(faltan(sig.fecha))} · Próxima actividad</div><div class="tit">${esc(sig.titulo)}</div>
          <div class="det">${detalle(sig)}</div>
          <a class="agregar" target="_blank" href="${esc(enlaceCalendario(sig))}">${ICO_CAL}Agregar a mi calendario</a></div></div>`; }
      (r.anuncios||[]).forEach(a=>{ html+=`<div class="anuncio"><div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11v2a1 1 0 0 0 1 1h2l5 4V6L6 10H4a1 1 0 0 0-1 1z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg></div>
        <div class="col">${a.titulo?`<b>${esc(a.titulo)}</b>`:''}${a.mensaje?`<p>${esc(a.mensaje)}</p>`:''}${a.enlace?`<a target="_blank" href="${esc(a.enlace)}">Ver más →</a>`:''}</div></div>` });
      html+='</div><div class="ini-l"><h3>'+(r.extendido?'Próximas actividades':'Lo que viene')+'</h3>';
      const porDia={}; evs.forEach(ev=>{ if(ev!==sig)(porDia[ev.fecha]=porDia[ev.fecha]||[]).push(ev) });
      const limite=clave(new Date(deClave(r.hoy).getTime()+21*864e5));
      Object.keys(r.festivos||{}).forEach(k=>{ if(k>=r.hoy&&k<=limite&&!porDia[k]&&Object.keys(porDia).some(x=>x>k)) porDia[k]=[] });
      const dias=Object.keys(porDia).sort();
      if(!dias.length) html+='<div class="vacio">No hay más actividades en las próximas semanas.</div>';
      let mesAnt=r.hoy.slice(0,7);
      dias.forEach(k=>{ const d=deClave(k);
        if(k.slice(0,7)!==mesAnt){ mesAnt=k.slice(0,7); html+=`<div class="sep-mes">${cap(MESES[d.getMonth()])}${d.getFullYear()!==deClave(r.hoy).getFullYear()?' '+d.getFullYear():''}</div>` }
        html+=`<div class="fila-ev"><div class="fecha${k===r.hoy?' hoy':''}"><b>${d.getDate()}</b><span>${DIA3[d.getDay()]}</span></div><div class="col">`;
        if(r.festivos&&r.festivos[k]) html+=`<div class="festivo">Festivo · ${esc(r.festivos[k])}</div>`;
        porDia[k].forEach(ev=>html+=tarjeta(ev));
        html+='</div></div>';
      });
      html+=`</div><div class="ini-b"><button class="boton sec" id="irCal">Ver el calendario completo</button>`;
      html+='</div></div>';
      box.innerHTML=html; $('irCal').onclick=()=>pestana('tCalendario');
    }
  }

  // ---------- calendario
  async function verCalendario(){
    if(!vistaMes){const h=new Date();vistaMes={a:h.getFullYear(),m:h.getMonth(),sel:clave(h)}}
    const box=$('tCalendario');
    box.innerHTML=`<div class="mes"><button class="flecha" id="mPrev">‹</button><h2>${cap(MESES[vistaMes.m])} ${vistaMes.a}</h2><button class="flecha" id="mNext">›</button></div><div id="calCuerpo"><div class="vacio">Cargando…</div></div>`;
    $('mPrev').onclick=()=>{vistaMes.m--;if(vistaMes.m<0){vistaMes.m=11;vistaMes.a--}vistaMes.sel=null;verCalendario()};
    $('mNext').onclick=()=>{vistaMes.m++;if(vistaMes.m>11){vistaMes.m=0;vistaMes.a++}vistaMes.sel=null;verCalendario()};
    const k='c_mes_'+quien()+'_'+vistaMes.a+'_'+vistaMes.m, vm=vistaMes.a+'-'+vistaMes.m;
    const previo=leerJ(k); if(previo&&previo.ok) pintarMes(previo);
    try{ const r=await llamar('appMes',token,vistaMes.a,vistaMes.m); if(!revisar(r))return;
      guardarJ(k,r); if(vm===vistaMes.a+'-'+vistaMes.m&&JSON.stringify(r)!==JSON.stringify(previo)) pintarMes(r);
      // precarga el mes siguiente para que cambiar de mes sea inmediato
      const sm=vistaMes.m===11?0:vistaMes.m+1, sa=vistaMes.m===11?vistaMes.a+1:vistaMes.a, ks='c_mes_'+quien()+'_'+sa+'_'+sm;
      if(!leerJ(ks)) llamar('appMes',token,sa,sm).then(x=>{if(x&&x.ok)guardarJ(ks,x)}).catch(()=>{});
    }catch(e){ if(!(previo&&previo.ok)) $('calCuerpo').innerHTML='<div class="vacio">No se pudo cargar: '+esc(e.message)+'</div>'}
    function pintarMes(r){
      const porDia={};
      r.eventos.forEach(ev=>{ let d=deClave(ev.fecha), fin=ev.hasta?deClave(ev.hasta):d;
        for(;d<=fin;d=new Date(d.getFullYear(),d.getMonth(),d.getDate()+1)){ if(d.getMonth()===vistaMes.m)(porDia[clave(d)]=porDia[clave(d)]||[]).push(ev) } });
      const prim=new Date(vistaMes.a,vistaMes.m,1), ult=new Date(vistaMes.a,vistaMes.m+1,0).getDate(), hoy=clave(new Date());
      if(!vistaMes.sel) vistaMes.sel=(hoy.slice(0,7)===clave(prim).slice(0,7))?hoy:clave(prim);
      let g='<div class="grilla">'+['D','L','M','M','J','V','S'].map(x=>`<div class="cab">${x}</div>`).join('');
      for(let i=0;i<prim.getDay();i++) g+='<div class="celda fuera"></div>';
      for(let d=1;d<=ult;d++){
        const f=new Date(vistaMes.a,vistaMes.m,d), k=clave(f), evs=porDia[k]||[];
        const cls=['celda']; if(f.getDay()===0||f.getDay()===6)cls.push('finde'); if(r.festivos[k])cls.push('fest'); if(k===hoy)cls.push('hoy'); if(k===vistaMes.sel)cls.push('sel');
        g+=`<div class="${cls.join(' ')}" data-k="${k}"><div class="num">${d}</div><div class="puntos">${evs.slice(0,4).map(ev=>`<i style="--c:${color(ev)}"></i>`).join('')}</div><div class="mini">${evs.slice(0,3).map(ev=>`<span style="--c:${color(ev)}">${esc(ev.titulo)}</span>`).join('')}${evs.length>3?`<em>+${evs.length-3} más</em>`:''}</div></div>`;
      }
      g+='</div>'+leyenda();
      const lista=k=>{ const evs=porDia[k]||[]; let h=`<h3>${esc(fechaLarga(k))}</h3>`;
        if(r.festivos[k]) h+=`<div class="festivo">Festivo · ${esc(r.festivos[k])}</div>`;
        h+=evs.length?evs.map(ev=>tarjeta(ev)+`<div style="margin:-2px 0 12px"><a class="agregar" style="margin-top:0" target="_blank" href="${esc(enlaceCalendario(ev))}">${ICO_CAL}Agregar a mi calendario</a></div>`).join(''):'<div class="vacio" style="padding:14px">Sin actividades este día.</div>';
        if(esLider()){ h+='<div id="servBox"></div>'; setTimeout(()=>verServidores(k),0) }
        return h };
      $('calCuerpo').innerHTML='<div class="cal-a">'+g+'</div><div id="calLista">'+lista(vistaMes.sel)+'</div>';
      box.querySelectorAll('.celda[data-k]').forEach(c=>c.onclick=()=>{ vistaMes.sel=c.dataset.k;
        box.querySelectorAll('.celda.sel').forEach(x=>x.classList.remove('sel')); c.classList.add('sel'); $('calLista').innerHTML=lista(c.dataset.k) });
    }
  }

  // ---------- plan operativo: todo el calendario general por meses

  async function verPlan(){

  function catDe(ev){ const c=color(ev); return CATS.findIndex(x=>x[1]===c) }
  function pintarPlan(r,irAHoy){
    const box=$('tPlan');
    const anios=[...new Set(r.plan.map(p=>p.fecha.slice(0,4)))];
    box.innerHTML=`<h2>Plan operativo ${esc(anios.join(' – '))}</h2><p class="sub">Todas las actividades de la iglesia en el año.</p>
      <input id="plBusca" class="buscar" placeholder="Buscar actividad o ministerio…" value="${esc(planBusca)}">
      <div class="filtros"><button data-f="todo">Todo</button>${CATS.map((c,i)=>`<button data-f="${i}" style="--c:${c[1]}"><i></i>${c[0]}</button>`).join('')}</div>
      <div id="plLista"></div>`;
    const pintarLista=()=>{
      box.querySelectorAll('.filtros button').forEach(b=>b.classList.toggle('on',b.dataset.f===String(planFiltro)));
      const q=norm(planBusca);
      const items=r.plan.filter(p=>(planFiltro==='todo'||catDe(p)===+planFiltro)&&(!q||norm(p.titulo+' '+p.responsable).indexOf(q)>=0));
      const porMes={}; items.forEach(p=>(porMes[p.fecha.slice(0,7)]=porMes[p.fecha.slice(0,7)]||[]).push(p));

      let h='<div class="planMeses">';
      if(!meses.length) h+='<div class="vacio">No hay actividades con ese filtro.</div>';
      meses.forEach(m=>{ const [a,mm]=m.split('-').map(Number), pasado=m<r.hoy.slice(0,7);
        h+=`<section class="pmes${pasado?' pasado':''}" id="pm-${m}"><div class="pmes-cab"><b>${cap(MESES[mm-1])}</b><span>${a} · ${porMes[m].length} actividad${porMes[m].length>1?'es':''}</span></div>`;
        porMes[m].forEach(p=>{ const d=deClave(p.fecha), fest=r.festivos[p.fecha], viejo=(p.hasta||p.fecha)<r.hoy;
          h+=`<div class="pfila${viejo?' viejo':''}${p.fecha===r.hoy?' hoy':''}"><div class="pdia"><b>${d.getDate()}</b><span>${DIA3[d.getDay()]}</span></div>
            <div class="pbar" style="--c:${color(p)}"></div><div class="col"><div class="t-tit">${esc(p.titulo)}${chipEstado(p.estado)}</div>
            <div class="t-det">${p.hasta?'Hasta el '+esc(fechaLarga(p.hasta))+' · ':''}${p.responsable?esc(p.responsable):'Toda la iglesia'}${fest?' · <span style="color:var(--rojo)">Festivo</span>':''}</div></div></div>` });
        h+='</section>' });
      h+='</div>';
      $('plLista').innerHTML=h;
    };
    pintarLista();
    box.querySelectorAll('.filtros button').forEach(b=>b.onclick=()=>{planFiltro=b.dataset.f;pintarLista()});
    $('plBusca').oninput=e=>{planBusca=e.target.value;pintarLista()};
    if(irAHoy){ const m=$('pm-'+r.hoy.slice(0,7)); if(m) setTimeout(()=>window.scrollTo({top:m.getBoundingClientRect().top+window.scrollY-(innerWidth>=900?80:70)}),30) }
  }

  function htmlServidores(r){
    const d=deClave(r.domingo);

    const orden=[], grupos={};
    r.items.forEach(x=>{ if(!grupos[x.area]){grupos[x.area]=[];orden.push(x.area)} grupos[x.area].push(x) });
    if(grupos['Nota']) h+=grupos['Nota'].map(x=>`<div class="serv-nota">📌 ${esc(x.s||x.nota)}</div>`).join('');
    h+='<div class="serv-grid">';

      h+=`<div class="serv-card" style="--c:${col}"><div class="serv-area">${esc(a)}</div>`;

      <label>MODALIDAD</label><select id="fMod">${['PRESENCIAL','VIRTUAL','HÍBRIDO'].map(m=>`<option ${norm(m)===norm(v.modalidad)?'selected':''}>${m}</option>`).join('')}</select>
      <label>NOTAS PARA EL EQUIPO (OPCIONAL)</label><textarea id="fNot" placeholder="Ej: Traer la Biblia y el cuaderno">${esc(ev?limpiarNotas(v.notas):'')}</textarea>
      <button class="boton" id="fGuardar">${ev?'Guardar cambios':'Programar reunión'}</button>
      <button class="boton sec" id="fVolver">Volver</button>`;
    $('fGuardar').onclick=async()=>{
      const datos={id:ev?ev.id:'',ministerio:$('fMin').value,titulo:$('fTit').value,fecha:$('fFec').value,horaIni:$('fHi').value,
                   horaFin:$('fHf').value,lugar:$('fLug').value,modalidad:$('fMod').value,notas:$('fNot').value};
      $('fGuardar').disabled=true; cargando(1);
      try{ const r=await llamar('appGuardarReunion',token,datos); if(!revisar(r))return; aviso(r.msg); pestana('tPanel') }
      catch(e){aviso('Error: '+e.message,true)} finally{cargando(0); if($('fGuardar'))$('fGuardar').disabled=false}
    };
    $('fVolver').onclick=()=>pestana('tPanel');
  }
  function confirmarCancelar(ev){
    $('mTitulo').textContent='¿Cancelar la reunión?';
    $('mTexto').textContent=ev.titulo+' · '+fechaLarga(ev.fecha)+'. El equipo recibe un aviso por correo.';
    $('modal').classList.add('on');
    $('mNo').onclick=()=>$('modal').classList.remove('on');
    $('mSi').onclick=async()=>{ $('modal').classList.remove('on'); cargando(1);
      try{ const r=await llamar('appCancelarReunion',token,ev.id); if(!revisar(r))return; aviso(r.msg); verPanel() }
      catch(e){aviso('Error: '+e.message,true)} finally{cargando(0)} };
  }

  // ---------- fotos del grupo → carpeta de Drive
  function reducir(file){ // achica la foto a 1600 px para que suba rápido
    return new Promise((ok,mal)=>{ const url=URL.createObjectURL(file), img=new Image();
      img.onload=()=>{ const max=1600, k=Math.min(1,max/Math.max(img.width,img.height));
        const c=document.createElement('canvas'); c.width=Math.round(img.width*k); c.height=Math.round(img.height*k);
        c.getContext('2d').drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(url); ok(c.toDataURL('image/jpeg',0.85)) };
      img.onerror=()=>{URL.revokeObjectURL(url);mal(new Error('No se pudo leer '+file.name))}; img.src=url; });
  }
  function verFotos(ministerio){
    PESTANAS.forEach(t=>$(t).classList.toggle('oculto',t!=='tFotos')); window.scrollTo(0,0);
    const mins=(usuario.soloCoordFotos?usuario.coordina:usuario.ministerios)||[]; let fotos=[];
    const box=$('tFotos');
    box.innerHTML=`<h2>Fotos del grupo</h2><p class="sub">Las fotos llegan a la carpeta de Drive de la iglesia, ordenadas por ministerio y mes.</p>
      <label>MINISTERIO</label><select id="ftMin">${mins.map(m=>`<option ${norm(m)===norm(ministerio)?'selected':''}>${esc(m)}</option>`).join('')}</select>
      <label>¿QUÉ ACTIVIDAD FUE? (OPCIONAL)</label><input id="ftDesc" placeholder="Ej: Ensayo de navidad">
      <label class="subir" for="ftArchivos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 8h3l2-3h6l2 3h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13" r="4"/></svg>
        ${usuario.soloCamara?'Tomar foto':'Tomar o elegir fotos'}<small>${usuario.soloCamara?'Se abre la cámara. Toca otra vez para tomar más.':'Puedes elegir varias a la vez'}</small></label>
      <input id="ftArchivos" type="file" accept="image/*" ${usuario.soloCamara?'capture="environment"':'multiple'} class="oculto">
      <div class="miniaturas" id="ftMini"></div>
      <button class="boton" id="ftSubir" disabled>Subir fotos</button>
      <button class="boton sec" id="ftVolver">Volver</button>`;
    const pintar=()=>{ $('ftMini').innerHTML=fotos.map((f,i)=>`<div class="${f.ok?'ok':''}"><img src="${f.datos}">${f.ok?'':`<button data-q="${i}">×</button>`}</div>`).join('');
      $('ftMini').querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{fotos.splice(+b.dataset.q,1);pintar()});
      $('ftSubir').disabled=!fotos.some(f=>!f.ok); const n=fotos.filter(f=>!f.ok).length; $('ftSubir').textContent=n?'Subir '+n+' foto'+(n>1?'s':''):'Subir fotos' };
    $('ftArchivos').onchange=async e=>{ let arch=[...e.target.files].slice(0,20); e.target.value='';
      if(usuario.soloCamara){ // solo fotos recién tomadas (de los últimos 10 minutos)
        const viejas=arch.filter(a=>Date.now()-a.lastModified>10*60*1000); arch=arch.filter(a=>viejas.indexOf(a)<0);
        if(viejas.length) aviso('Solo se pueden subir fotos tomadas en este momento con la cámara.',true); }
      if(fotos.length+arch.length>20){aviso('Máximo 20 fotos por envío.',true);arch=arch.slice(0,Math.max(0,20-fotos.length))}
      if(!arch.length)return; cargando(1);
      try{ for(const a of arch) fotos.push({datos:await reducir(a)}) }catch(x){aviso(x.message,true)} finally{cargando(0); pintar()} };
    $('ftSubir').onclick=async()=>{
      const pend=fotos.filter(f=>!f.ok); $('ftSubir').disabled=true;
      for(let i=0;i<pend.length;i++){
        $('ftSubir').textContent='Subiendo '+(i+1)+' de '+pend.length+'…';
        try{ const r=await llamar('appSubirFoto',token,{ministerio:$('ftMin').value,descripcion:$('ftDesc').value,datos:pend[i].datos,n:i+1,total:pend.length});
          if(!revisar(r)){pintar();return} pend[i].ok=true; pintar(); $('ftSubir').disabled=true }
        catch(e){ aviso('Falló una foto: '+e.message,true); pintar(); return }
      }
      aviso('¡Listo! '+pend.length+' foto'+(pend.length>1?'s':'')+' en Drive.'); $('ftSubir').textContent='Fotos enviadas';
    };
    $('ftVolver').onclick=()=>pestana('tPanel');
  }

  // ---------- 🛠 herramientas (solo administradores)
  let herrMeses=new Set([new Date().getMonth()]);
  function b64aBlob(b64,tipo){ const bin=atob(b64), a=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i); return new Blob([a],{type:tipo}) }
  function descargar(blob,nombre){ const u=URL.createObjectURL(blob), a=document.createElement('a'); a.href=u; a.download=nombre; a.target='_blank'; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(u),30000) }
  async function compartir(blob,nombre){
    const f=new File([blob],nombre,{type:blob.type});
    if(navigator.canShare&&navigator.canShare({files:[f]})){ try{ await navigator.share({files:[f],title:nombre}); return }catch(e){ if(e.name==='AbortError')return } }
    descargar(blob,nombre); aviso('Tu navegador no deja compartir directo: se descargó el archivo.');
  }
  function verHerr(){
    PESTANAS.forEach(t=>$(t).classList.toggle('oculto',t!=='tHerr')); window.scrollTo(0,0);
    const box=$('tHerr');
    box.innerHTML=`<h2>Herramientas</h2><p class="sub">Solo para administradores. Todo queda guardado en la carpeta «PUBLICIDAD 2027» de Drive.</p>
      <div class="herr-caja"><h3>📣 Publicidad</h3>
        <div class="herr-botones"><button data-pub="semana"><b>De la semana</b><small>Domingo y actividades hasta el domingo</small></button>
          <button data-pub="domingo"><b>Solo el domingo</b><small>La pieza del próximo domingo</small></button></div>
        <label>DE UNA ACTIVIDAD</label><select id="hEv"><option value="">Cargando actividades…</option></select>
        <button class="boton" id="hPubEv" style="margin-top:10px">Generar publicidad de esta actividad</button></div>
      <div class="herr-caja"><h3>🖨 PDF del mes</h3><p class="sub" style="margin:0 0 8px">Toca uno o varios meses.</p>
        <div class="meses12">${MES3.map((m,i)=>`<button data-m="${i}">${cap(m)}</button>`).join('')}</div>
        <div class="fila"><div><button class="boton" id="hPdfMes" style="margin-top:12px">Calendario (PDF)</button></div>
          <div><button class="boton" id="hPdfPlan" style="margin-top:12px;background:var(--azul)">Planner (PDF)</button></div></div></div>
      <div id="hRes"></div>
      <button class="boton sec" id="hVolver">Volver</button>`;
    const pintarMeses=()=>box.querySelectorAll('[data-m]').forEach(b=>b.classList.toggle('on',herrMeses.has(+b.dataset.m)));
    pintarMeses();
    box.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{ const m=+b.dataset.m; herrMeses.has(m)?herrMeses.delete(m):herrMeses.add(m); pintarMeses() });
    box.querySelectorAll('[data-pub]').forEach(b=>b.onclick=()=>generarPub(b.dataset.pub));
    $('hPubEv').onclick=()=>{ const v=$('hEv').value; if(!v){aviso('Elige una actividad',true);return} const [fecha,...t]=v.split('|'); generarPub('evento',{fecha:fecha,titulo:t.join('|')}) };
    $('hPdfMes').onclick=()=>generarPdf('mes'); $('hPdfPlan').onclick=()=>generarPdf('planner');
    $('hVolver').onclick=()=>pestana('tPanel');
    llamar('appHerrEventos',token).then(r=>{ if(!revisar(r))return;
      $('hEv').innerHTML='<option value="">Elige una actividad…</option>'+r.eventos.map(e=>{const d=deClave(e.fecha);
        return `<option value="${esc(e.fecha+'|'+e.titulo)}">${d.getDate()} ${MES3[d.getMonth()]} · ${esc(e.titulo)}</option>`}).join('') }).catch(e=>aviso(e.message,true));
  }
  function esperando(txt){ $('hRes').innerHTML=`<div class="herr-caja herr-esp"><div class="rueda"></div><div><b>${esc(txt)}</b><small>Puede tardar hasta un minuto. No cierres la app.</small></div></div>`; $('hRes').scrollIntoView({behavior:'smooth'}) }
  async function generarPub(modo,ev){
    esperando('Generando la publicidad…');
    try{ const r=await llamar('appHerrPublicidad',token,modo,ev||null); if(!revisar(r)){ $('hRes').innerHTML=''; return }
      const blobs=r.piezas.map(p=>b64aBlob(p.datos,'image/jpeg'));
      $('hRes').innerHTML=`<div class="herr-caja"><h3>Listo · ${r.piezas.length} pieza${r.piezas.length>1?'s':''}</h3>
        ${r.piezas.length>1?'<button class="boton" id="hTodas" style="margin:0 0 12px">Compartir todas</button>':''}
        <div class="piezas">${r.piezas.map((p,i)=>`<div class="pieza"><img src="${URL.createObjectURL(blobs[i])}"><div class="acciones">
          <button data-sh="${i}">Compartir</button><button data-dl="${i}">Descargar</button></div></div>`).join('')}</div>
        <p class="sub" style="margin-top:10px"><a href="${esc(r.carpeta)}" target="_blank">Abrir carpeta en Drive</a> · <a href="${esc(r.slides)}" target="_blank">Ajustar en Slides</a></p></div>`;
      $('hRes').querySelectorAll('[data-sh]').forEach(b=>b.onclick=()=>compartir(blobs[+b.dataset.sh],r.piezas[+b.dataset.sh].nombre));
      $('hRes').querySelectorAll('[data-dl]').forEach(b=>b.onclick=()=>descargar(blobs[+b.dataset.dl],r.piezas[+b.dataset.dl].nombre));
      if($('hTodas')) $('hTodas').onclick=async()=>{ const fs=r.piezas.map((p,i)=>new File([blobs[i]],p.nombre,{type:'image/jpeg'}));
        if(navigator.canShare&&navigator.canShare({files:fs})){ try{await navigator.share({files:fs})}catch(e){} } else { fs.forEach((f,i)=>descargar(blobs[i],f.name)) } };
    }catch(e){ $('hRes').innerHTML=''; aviso('Error: '+e.message,true) }
  }
  async function generarPdf(tipo){
    if(!herrMeses.size){aviso('Elige al menos un mes',true);return}
    esperando(tipo==='planner'?'Armando el planner…':'Armando el calendario…');
    try{ const r=await llamar('appHerrPdf',token,tipo,[...herrMeses]); if(!revisar(r)){ $('hRes').innerHTML=''; return }
      const blob=b64aBlob(r.datos,'application/pdf');
      $('hRes').innerHTML=`<div class="herr-caja"><h3>Listo</h3><p style="margin:0 0 10px;font-weight:700">📄 ${esc(r.nombre)}</p>
        <div class="acciones"><button id="hPa">Abrir</button><button id="hPs">Compartir</button><button id="hPd">Descargar</button></div>
        <p class="sub" style="margin-top:10px"><a href="${esc(r.url)}" target="_blank">Ver en Drive</a></p></div>`;
      $('hPa').onclick=()=>window.open(URL.createObjectURL(blob),'_blank');
      $('hPs').onclick=()=>compartir(blob,r.nombre); $('hPd').onclick=()=>descargar(blob,r.nombre);
    }catch(e){ $('hRes').innerHTML=''; aviso('Error: '+e.message,true) }
  }

  function cambiarNombre(){
    $('mTitulo').textContent='Tu nombre en la app';
    $('mTexto').innerHTML='Así te saludará la app y así te verá tu equipo en Novedades.<input id="mNombre" maxlength="30" style="margin-top:12px" placeholder="Ej: Cristian" value="'+esc(usuario.nombre||'')+'">';
    $('mSi').textContent='Guardar'; $('mSi').style.background='var(--naranja)'; $('mNo').textContent='Cancelar';
    $('modal').classList.add('on'); setTimeout(()=>$('mNombre').focus(),50);
    const cerrar=()=>{ $('modal').classList.remove('on'); $('mSi').textContent='Sí, cancelar'; $('mSi').style.background='var(--rojo)'; $('mNo').textContent='Volver' };
    $('mNo').onclick=cerrar;
    $('mSi').onclick=async()=>{ const n=$('mNombre').value; cerrar(); cargando(1);
      try{ const r=await llamar('appGuardarNombre',token,n); if(!revisar(r))return; usuario=r.usuario;
        guardarJ('c_arranque_'+token,{ok:true,info:info,usuario:usuario,token:token}); aplicarUsuario(); aviso(r.msg); verPanel() }
      catch(e){aviso('Error: '+e.message,true)} finally{cargando(0)} };
  }

  // ---------- novedades
  const ACC={'Subió fotos':['var(--naranja)','📷'],'Programó':['var(--oliva)','+'],'Cambió':['var(--azul)','✎'],'Reprogramó':['var(--azul)','↻'],'Canceló':['var(--rojo)','×'],'Equipo actualizado':['var(--amarillo)','★']};
  function hace(iso){ const d=new Date(iso), s=(Date.now()-d)/1000;
    if(s<3600) return 'Hace '+Math.max(1,Math.round(s/60))+' min'; if(s<86400) return 'Hace '+Math.round(s/3600)+' h';
    if(s<7*86400){const n=Math.round(s/86400);return n<=1?'Ayer':'Hace '+n+' días'} return d.getDate()+' de '+MESES[d.getMonth()]; }
  async function verNovedades(){
    const box=$('tNovedades'); const cab='<h2>Novedades</h2><p class="sub">Lo que se ha programado, cambiado o cancelado en tus ministerios.</p>';
    box.innerHTML=cab+'<div class="vacio">Cargando…</div>';
    try{ const r=await llamar('appNovedades',token); if(!revisar(r))return;
      guardar('abVisto_'+usuario.email,clave(new Date())+'T'+new Date().toTimeString().slice(0,5)); $('puntoNov').classList.add('oculto');
      let html=cab;
      if(!r.novedades.length) html+='<div class="vacio">Todavía no hay novedades.</div>';
      r.novedades.forEach(n=>{ const a=ACC[n.accion]||['var(--gris)','•'];
        const quien=n.quien===usuario.email?'Tú':(n.nombre||n.quien.split('@')[0]);
        html+=`<div class="nov"><div class="ico" style="--c:${a[0]}">${a[1]}</div><div class="col"><div class="txt"><b>${esc(quien)}</b> ${esc(n.accion.toLowerCase())} · <b>${esc(n.ministerio)}</b><br>${esc(n.detalle)}</div>
          <div class="cuando">${esc(hace(n.cuando))}</div></div></div>`; });
      box.innerHTML=html;
    }catch(e){box.innerHTML='<div class="vacio">No se pudo cargar: '+esc(e.message)+'</div>'}
  }
  async function revisarNovedades(){
    try{ const r=await llamar('appNovedades',token); if(!r||!r.ok)return;
      const visto=leer('abVisto_'+usuario.email)||'';
      $('puntoNov').classList.toggle('oculto',!r.novedades.some(n=>n.cuando>visto&&n.quien!==usuario.email));
    }catch(e){}
  }

  // ---------- ingreso de líderes
  function paso(id){ ['pasoCorreo','pasoClave','pasoCodigo'].forEach(x=>$(x).classList.toggle('oculto',x!==id)); if(id==='pasoCorreo')$('correo').value=leer('abCorreo')||'' }
  async function pedirCodigo(primera){
    cargando(1); try{ const r=await llamar('appPedirCodigo',correoPendiente); if(!revisar(r))return;
      $('txtCodigo').textContent=(primera?'Es tu primera vez. ':'')+'Te enviamos un código a '+correoPendiente+' (puede tardar hasta 1 minuto; revisa también Spam). Escríbelo y crea tu clave.';
      $('codigo').value=$('clave1').value=$('clave2').value=''; paso('pasoCodigo'); $('codigo').focus();
    }catch(e){aviso('No se pudo enviar el código: '+e.message,true)}finally{cargando(0)}
  }
  $('btnContinuar').onclick=async()=>{
    const c=$('correo').value.trim().toLowerCase(); if(!c){aviso('Escribe tu correo',true);return}
    cargando(1); let r; try{ r=await llamar('appRevisarCorreo',c) }catch(e){aviso('Error: '+e.message,true);return}finally{cargando(0)}
    if(!revisar(r))return;
    correoPendiente=c; guardar('abCorreo',c);
    if(r.tieneClave){ $('clave').value=''; paso('pasoClave'); $('clave').focus() } else pedirCodigo(true);
  };
  $('correo').addEventListener('keydown',e=>{if(e.key==='Enter')$('btnContinuar').click()});
  function listo(r){ token=r.token; usuario=r.usuario; guardar('abToken',token); guardarJ('c_arranque_'+token,{ok:true,info:info,usuario:usuario,token:token}); aplicarUsuario(); pestana('tPanel'); revisarNovedades() }
  $('btnEntrar').onclick=async()=>{
    cargando(1); try{ const r=await llamar('appEntrar',correoPendiente,$('clave').value); if(!revisar(r))return; listo(r) }
    catch(e){aviso('Error: '+e.message,true)}finally{cargando(0)}
  };
  $('clave').addEventListener('keydown',e=>{if(e.key==='Enter')$('btnEntrar').click()});
  $('btnOlvide').onclick=()=>pedirCodigo(false);
  $('btnCrear').onclick=async()=>{
    if($('codigo').value.replace(/\D/g,'').length!==6){aviso('Escribe el código de 6 números',true);return}
    if($('clave1').value.length<6){aviso('La clave debe tener al menos 6 caracteres',true);return}
    if($('clave1').value!==$('clave2').value){aviso('Las dos claves no coinciden',true);return}
    cargando(1); try{ const r=await llamar('appVerificarCodigo',correoPendiente,$('codigo').value,$('clave1').value,$('nombreNuevo').value); if(!revisar(r))return;
      aviso('¡Listo! Tu clave quedó guardada.'); listo(r) }
    catch(e){aviso('Error: '+e.message,true)}finally{cargando(0)}
  };
  document.querySelectorAll('[data-otro]').forEach(a=>a.onclick=e=>{e.preventDefault();paso('pasoCorreo')});

  async function modoPublico(){
    token='publico'; guardar('abToken',null);
    try{ const r=await llamar('appSesion','publico'); usuario=r&&r.ok?r.usuario:null }catch(e){usuario=null}
    aplicarUsuario(); pestana(info.publico&&usuario?'tInicio':'tLideres');
  }
  function sesionVencida(){ aviso('Tu sesión venció. Vuelve a entrar.',true); modoPublico() }
  $('btnSalir').onclick=async e=>{ e.preventDefault(); try{await llamar('appSalir',token)}catch(x){} modoPublico() };

  // ---------- arranque: UNA sola llamada; mientras tanto se muestra lo último guardado en el celular
  function aplicarArranque(r,primera){
    if(r.info){info=r.info; if(info.sede)$('hSede').textContent=info.sede}
    token=r.token||'publico'; usuario=r.usuario;
    aplicarUsuario();
    if(!usuario||!info.publico&&!esLider()){ pestana('tLideres'); return }
    if(primera){ PESTANAS.forEach(t=>$(t).classList.toggle('oculto',t!=='tInicio'));
      document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t==='tInicio')) }
    if(!$('tInicio').classList.contains('oculto')) verInicio(r.proximos||undefined);
  }
  (async function(){
    const guardado=leer('abToken')||'publico';
    const previo=leerJ('c_arranque_'+guardado);
    if(previo) aplicarArranque(previo,true); else cargando(1);
    try{
      const r=await llamar('appArranque',guardado);
      cargando(0);
      if(r.sesionVencida){ guardar('abToken',null); aviso('Tu sesión venció. Vuelve a entrar.',true) }
      guardarJ('c_arranque_'+r.token,r);
      aplicarArranque(r,!previo||r.token!==guardado);
      if(esLider()) revisarNovedades();
    }catch(e){ cargando(0); if(!previo){ aviso('No se pudo conectar. Revisa tu internet.',true); modoPublico() } }
  })();
})();
</script>
